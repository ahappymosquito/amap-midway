<!-- 本文件实现多点选址单页：网页定位、地点批量导入、按通勤时间或绝对距离比较、扫街榜六类选址。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多点选址 · 餐馆酒店</title>
    <link rel="stylesheet" href="/static/styles.css?v=0114" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-area" aria-label="选址地图">
        <div id="map" class="map"></div>
        <div id="routePanel" class="route-times" hidden></div>
        <div id="boardBar" class="board-bar" hidden></div>
        <div id="mapLegend" class="map-legend" aria-hidden="true">
          <span class="legend-item mode-riding">出站骑行</span>
          <span class="legend-item mode-walk">步行换乘</span>
        </div>
        <div id="mapStatus" class="map-status" role="status">输入至少一个地点，在地图上选择美食、酒店或玩乐</div>
      </section>

      <aside class="control-panel" aria-label="搜索控制面板">
        <header class="panel-header">
          <h1>多点选址</h1>
          <p>可按地铁通勤时间或直线距离比较。地点可逐个填写，也可分行或用分号批量导入。搜完会附带附近搭配推荐。</p>
        </header>

        <form id="meetForm" class="search-form">
          <div id="originsList" class="origins-list"></div>
          <datalist id="originHistory"></datalist>
          <div id="originHistoryBar" class="origin-history" hidden></div>
          <div class="origin-actions">
            <button id="locateButton" type="button">使用当前位置</button>
            <button id="addOriginButton" type="button">添加地点</button>
            <button id="importOriginButton" type="button">导入地点</button>
          </div>
          <div id="importPanel" class="import-panel" hidden>
            <label>
              批量地点
              <textarea id="importOrigins" rows="4" placeholder="每行一个，也可用分号隔开：&#10;望京SOHO&#10;北控水务大厦；中国黄金大厦"></textarea>
            </label>
            <button id="applyImportButton" type="button">填入地点</button>
            <p class="hint">最多 6 个。换行或分号（；或 ;）隔开。在地点框里直接粘贴名单也可以。</p>
          </div>

          <fieldset>
            <legend>找什么</legend>
            <div class="choice-row">
              <label><input type="radio" name="category" value="restaurant" checked /> 美食</label>
              <label><input type="radio" name="category" value="hotel" /> 酒店</label>
              <label><input type="radio" name="category" value="play" /> 玩乐</label>
              <label><input type="radio" name="category" value="coffee" /> 咖啡</label>
              <label><input type="radio" name="category" value="bar" /> 酒吧</label>
              <label><input type="radio" name="category" value="scenic" /> 景点</label>
            </div>
          </fieldset>

          <div class="coord-grid">
            <label>
              人数
              <input id="peopleInput" type="number" min="1" max="8" step="1" value="2" />
            </label>
            <label id="budgetFieldLabel">
              <span id="budgetLabelText">人均预算（元）</span>
              <input id="budgetInput" type="number" min="50" max="5000" step="50" value="300" />
            </label>
          </div>
          <p class="hint" id="budgetHint">按餐馆人均比较。无人均则请到美团/点评核价。</p>

          <fieldset>
            <legend>怎么比</legend>
            <div class="choice-row two">
              <label><input type="radio" name="sortBy" value="transit" checked /> 通勤时间</label>
              <label><input type="radio" name="sortBy" value="distance" /> 绝对距离</label>
            </div>
            <p class="hint" id="sortHint">按最慢一侧地铁时长排序。可设通勤上限。</p>
          </fieldset>
          <fieldset id="transitLimitField">
            <legend>通勤上限</legend>
            <div class="choice-row">
              <label><input type="radio" name="maxTransit" value="0" checked /> 不限</label>
              <label><input type="radio" name="maxTransit" value="20" /> 20分</label>
              <label><input type="radio" name="maxTransit" value="30" /> 30分</label>
              <label><input type="radio" name="maxTransit" value="45" /> 45分</label>
              <label><input type="radio" name="maxTransit" value="60" /> 60分</label>
            </div>
          </fieldset>
          <fieldset id="radiusField" hidden>
            <legend>搜索范围</legend>
            <div class="choice-row two">
              <label><input type="radio" name="radiusM" value="1500" /> 1.5km</label>
              <label><input type="radio" name="radiusM" value="3000" checked /> 3km</label>
              <label><input type="radio" name="radiusM" value="5000" /> 5km</label>
              <label><input type="radio" name="radiusM" value="8000" /> 8km</label>
            </div>
          </fieldset>

          <div class="actions single">
            <button id="meetSearchButton" type="submit">搜索</button>
          </div>
        </form>

        <div id="message" class="message" role="status"></div>

        <section class="results-section" aria-label="搜索结果">
          <div class="results-header">
            <h2>推荐</h2>
            <span id="resultCount">0 个</span>
          </div>
          <ol id="resultsList" class="results-list"></ol>
          <details id="moreResults" class="more-results" hidden>
            <summary id="moreResultsSummary">其余结果</summary>
            <ol id="moreResultsList" class="results-list"></ol>
          </details>
          <section id="companionSection" class="companion-section" hidden>
            <div class="results-header">
              <h2 id="companionTitle">附近还可以</h2>
            </div>
            <ol id="companionList" class="results-list"></ol>
          </section>
        </section>
      </aside>
    </main>

    <script src="/static/app.js?v=0114" defer></script>
  </body>
</html>
